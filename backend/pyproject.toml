[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaponics-backend"
version = "1.0.0"
description = "Backend API for a single Aquaponics monitoring system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-jose[cryptography]>=3.5,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "cryptography>=45,<46",
  "python-multipart>=0.0.20,<1.0",
  "email-validator>=2.2,<3.0",
  "orjson>=3.10,<4.0",
  "httpx>=0.28,<1.0",
  "paho-mqtt>=2.1,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.16,<2.0",
  "types-python-jose>=3.5.0.20250531"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
