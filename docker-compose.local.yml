name: aquaponics-platform

x-backend-service: &backend-service
  image: aquaponics-platform-backend
  build:
    context: ./backend
  restart: unless-stopped
  env_file:
    - ./backend/.env
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend-service
    environment:
      REDIS_URL: redis://redis:6379/0
      CATALOG_RECORD_CACHE_TTL_SECONDS: 60
      REDIS_CACHE_SOCKET_TIMEOUT_SECONDS: 0.5
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api_gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/backend-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    <<: *backend-service
    command: python -m app.jobs.runner

  mqtt_consumer:
    <<: *backend-service
    command: python -m app.mqtt.consumer

  frontend:
    image: aquaponics-platform-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 5
