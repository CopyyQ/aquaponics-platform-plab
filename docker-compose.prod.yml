# Lop override cho moi truong production tren VPS.
# Chay kem docker-compose.yml, KHONG chay mot minh:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Khac biet so voi docker-compose.yml:
#   - Doi ten compose project, tranh dung ten voi stack khac tren cung may.
#   - Doi database sang aquaponics_fresh_plab_final (khop voi ban dump mang tu server LAN).
#   - Khong publish 3000/8000/1883 ra Internet nua, chi bind vao 127.0.0.1.
#   - Them Caddy lam reverse proxy, tu cap chung chi HTTPS cho domain.
name: aquaponics-plab-prod

services:
  postgres:
    # Ghim dung phien ban dang chay tren server LAN (timescaledb 2.28.3 / PostgreSQL 16.x).
    # Tag "latest-pg16" trong docker-compose.yml se keo ban moi nhat tai thoi diem build,
    # lech phien ban extension timescaledb la restore ban dump se loi.
    image: timescale/timescaledb:2.28.3-pg16
    environment:
      POSTGRES_DB: aquaponics_fresh_plab_final
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquaponics_fresh_plab_final"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aquaponics_fresh_plab_final
    ports: !override
      - "127.0.0.1:8000:8000"

  mqtt_consumer:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aquaponics_fresh_plab_final

  scheduler:
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/aquaponics_fresh_plab_final

  # Broker chi lang nghe trong may, thiet bi ngoai Internet CHUA ket noi duoc.
  # Khi nao muon mo cho thiet bi, xem muc "Buoc sau" trong docs/DEPLOY.md.
  mqtt:
    ports: !override
      - "127.0.0.1:1883:1883"

  frontend:
    ports: !override
      - "127.0.0.1:3000:80"

  reverse_proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Thieu bien DOMAIN - tao file .env o thu muc goc voi dong DOMAIN=ten-mien-cua-ban}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
